name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Python lint
        run: ruff check .
      - name: Validate metadata.json against the Holoscan CLI schema
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
        run: |
          pip install 'holoscan-cli[create]' -c requirements-cli.txt
          python .github/workflows/scripts/validate_metadata.py
{% if cookiecutter.language == 'cpp' %}
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: C++ format check
        run: |
          find operators applications tests \
               -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
{% endif %}

  build-only:
    name: CMake configure (CPU, no GPU required)
    # Verifies the CMake graph and Python packaging without a GPU runner.
    # holoscan is installed from PyPI (CPU wheel) solely to satisfy find_package(holoscan).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install holoscan (CPU wheel) + CMake
        run: |
          pip install holoscan cmake ninja
      - name: CMake configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -D{{ cookiecutter.module_slug | upper }}_BUILD_TESTING=OFF \
            -DBUILD_ALL=ON

  build-and-test:
    name: Build and Test (Holoscan {{ cookiecutter.holoscan_version }})
    # Requires a self-hosted GPU runner and the Holoscan container image.
    # To set up a self-hosted runner see:
    #   https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners
    # TODO: update the runner label and container image for your CI environment.
    runs-on: [self-hosted, linux, x86_64, gpu]

    container:
      image: nvcr.io/nvidia/clara-holoscan/holoscan:v{{ cookiecutter.holoscan_version }}-cuda13
      options: --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: python -m pip install 'pytest>=8.2' build

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -D{{ cookiecutter.module_slug | upper }}_BUILD_TESTING=ON \
            -DBUILD_ALL=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"
{% if cookiecutter.language == 'cpp' %}
      - name: C++ tests (CTest)
        run: ctest --test-dir build --output-on-failure -L unit
{% endif %}
      - name: Python tests (pytest)
        run: |
          {{ cookiecutter.module_slug | upper }}_BUILD_DIR=build \
          PYTHONPATH=build/python/lib${PYTHONPATH:+:$PYTHONPATH} \
          python -m pytest tests/python/ -v --tb=short

      - name: Build and install Debian package
        run: |
          cpack \
            --config build/pkg/CPackConfig-{{ cookiecutter.module_repo_name }}.cmake \
            -B build/packages \
            -G DEB
          package=$(find build/packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --field "$package" Depends \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -Fx "holoscan-cuda-13 (>= {{ cookiecutter.holoscan_version }})"
          apt-get install -y "./$package"
          dpkg-query --show --showformat='${Status}\n' \
            {{ cookiecutter.module_repo_name }} | grep -Fx 'install ok installed'
      - name: Build and install wheel in a clean environment
        run: |
          python -m build --wheel
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python - "$wheel" <<'PY'
          import re
          import sys
          import zipfile
          from email.parser import Parser

          with zipfile.ZipFile(sys.argv[1]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(archive.read(metadata_path).decode())
          assert any(
              re.fullmatch(r"holoscan-cu13\s*>=\s*{{ cookiecutter.holoscan_version }}", spec)
              for spec in metadata.get_all("Requires-Dist", [])
          ), metadata.get_all("Requires-Dist", [])
          PY
          python -m venv /tmp/holoscan-module-wheel-check
          /tmp/holoscan-module-wheel-check/bin/python -m pip install "$wheel"
          /tmp/holoscan-module-wheel-check/bin/python -m pip check
          /tmp/holoscan-module-wheel-check/bin/python - <<'PY'
          from importlib.metadata import distribution
          from holoscan.core import Operator
          from holoscan.{{ cookiecutter.module_slug }} import {{ cookiecutter.operator_slug.split('_')|map('capitalize')|join('') }}

          assert distribution("holoscan-cu13").version
          assert issubclass({{ cookiecutter.operator_slug.split('_')|map('capitalize')|join('') }}, Operator)
          PY
          /tmp/holoscan-module-wheel-check/bin/python \
            applications/{{ cookiecutter.module_slug }}_pipeline/python/{{ cookiecutter.module_slug }}_pipeline.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/Testing/
