name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Python lint
        run: ruff check .
      - name: Validate metadata.json against the Holoscan CLI schema
        env:
          PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
        run: |
          pip install 'holoscan-cli[create]' -c requirements-cli.txt
          python .github/workflows/scripts/validate_metadata.py
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: C++ format check
        run: |
          find operators applications tests \
               -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror

  build-only:
    name: CMake configure (Holoscan {{ cookiecutter.holoscan_version }} container, no GPU required)
    # Verifies the CMake graph without a GPU runner. The Holoscan SDK 5.0 C++
    # headers and CMake package are taken from the SDK container image.
    runs-on: ubuntu-latest
    container:
      image: nvcr.io/nvidia/clara-holoscan/holoscan:v{{ cookiecutter.holoscan_version }}-cuda13
    steps:
      - uses: actions/checkout@v4
      - name: CMake configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -D{{ cookiecutter.module_slug | upper }}_BUILD_TESTING=OFF \
            -DBUILD_ALL=ON

  build-and-test:
    name: Build and Test (Holoscan {{ cookiecutter.holoscan_version }})
    # Requires a self-hosted GPU runner and the Holoscan container image.
    # To set up a self-hosted runner see:
    #   https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners
    # TODO: update the runner label and container image for your CI environment.
    runs-on: [self-hosted, linux, x86_64, gpu]

    container:
      image: nvcr.io/nvidia/clara-holoscan/holoscan:v{{ cookiecutter.holoscan_version }}-cuda13
      options: --gpus all

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -D{{ cookiecutter.module_slug | upper }}_BUILD_TESTING=ON \
            -DBUILD_ALL=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: C++ tests (CTest)
        run: ctest --test-dir build --output-on-failure -L unit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/Testing/
