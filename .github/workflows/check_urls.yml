name: Check URLs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-urls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: ${{ matrix.kind }} links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: Markdown cross-reference
            args: --offline --include-fragments
          - kind: External URL
            args: --scheme https --scheme http
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config .github/lychee.toml
            --root-dir '${{ github.workspace }}'
            --remap '^https://github\.com/nvidia-holoscan/holoscan-cli/blob/main/(.*)$ file://${{ github.workspace }}/$1'
            ${{ matrix.args }}
            '**/*.md' '.github/**/*.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
