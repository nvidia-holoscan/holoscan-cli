name: Clean up generated Module branches
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    if: ${{ vars.MODULE_E2E_ENABLED == 'true' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    # Default-branch-only credentials let scheduled cleanup run without approval.
    environment: module-e2e-cleanup
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: token
        with:
          app-id: ${{ vars.MODULE_E2E_APP_ID }}
          private-key: ${{ secrets.MODULE_E2E_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: write
      - name: Remove inactive branches older than 24 hours
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          python .github/scripts/module_e2e.py sweep \
            --repository "$GITHUB_REPOSITORY" --older-than-hours 24
